name: Build Release
on:
  push:
    tags:
      - desktop/v**
permissions:
  contents: write
  actions: read
  checks: read
  deployments: read
  id-token: none
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: none
  statuses: read
env:
  ARTIFACT_NAME: EasyTransfer
  DISTRIBUTION_NAME: EasyTransfer
jobs:
  build-linux:
    runs-on: [ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - run: ./gradlew clean createReleaseDistributable
      - run: pushd ./build/compose/binaries && ls -al && cd main-release && ls -al && popd
      - run: pushd ./build/compose/binaries/main-release/app && ls -al && tar -cvzf "app.tar.gz" "${{ ARTIFACT_NAME }}" && mv "app.tar.gz" "../../../../../GiantLogViewer-${{ github.ref_name }}-linux-${{ runner.arch }}.tar.gz" && popd
      - uses: softprops/action-gh-release@v1
        with:
          files: "${{ DISTRIBUTION_NAME }}-${{ github.ref_name }}-linux-${{ runner.arch }}.tar.gz"
          draft: true
  build-windows:
    runs-on: [windows-2022, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - run: ./gradlew clean createReleaseDistributable
      - run: pushd ./build/compose/binaries && dir && cd main-release && dir && popd
      - run: pushd ./build/compose/binaries/main-release/app && dir && tar -acf "app.zip" "${{ ARTIFACT_NAME }}" && move "app.zip" "../../../../../${{ DISTRIBUTION_NAME }}-${{ github.ref_name }}-windows-${{ runner.arch }}.zip" && popd
      - uses: softprops/action-gh-release@v1
        with:
          files: "${{ DISTRIBUTION_NAME }}-${{ github.ref_name }}-windows-${{ runner.arch }}.zip"
          draft: true
  build-macos:
    strategy:
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
      - run: ./gradlew clean packageReleaseDistributionForCurrentOS
      - run: mv ./build/compose/binaries/main-release/dmg/*.dmg "./${{ DISTRIBUTION_NAME }}-${{ github.ref_name }}-macos-${{ runner.arch }}.dmg"
      - uses: softprops/action-gh-release@v1
        with:
          files: "./${{ DISTRIBUTION_NAME }}-${{ github.ref_name }}-macos-${{ runner.arch }}.dmg"
          draft: true
