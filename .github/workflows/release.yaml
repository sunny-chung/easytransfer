name: Build Release
on:
  push:
    tags:
      - desktop/v**
permissions:
  contents: write
  actions: read
  checks: read
  deployments: read
  id-token: none
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: none
  statuses: read
env:
  ARTIFACT_NAME: EasyTransfer
  DISTRIBUTION_NAME: EasyTransfer
  MODULE_BASE_PATH: desktopApp/
  MODULE_PARENT_NAVIGATION: ../
jobs:
  build-linux:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        include:
          - os: ubuntu-22.04
            java_dist: 'corretto'
          - os: ubuntu-22.04-arm
            java_dist: 'temurin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.java_dist }}
          java-version: '21'
      - run: ./gradlew clean createReleaseDistributable
      - run: pushd ./${{ env.MODULE_BASE_PATH }}build/compose/binaries && ls -al && cd main-release && ls -al && popd
      - run: pushd ./${{ env.MODULE_BASE_PATH }}build/compose/binaries/main-release/app && ls -al && tar -cvzf "app.tar.gz" "${{ env.ARTIFACT_NAME }}" && mv "app.tar.gz" "../../../../../${{ env.MODULE_PARENT_NAVIGATION }}${{ env.DISTRIBUTION_NAME }}-${GITHUB_REF_NAME/desktop\//}-linux-${{ runner.arch }}.tar.gz" && popd && ls -al
      - uses: softprops/action-gh-release@v1
        with:
          files: "${{ env.DISTRIBUTION_NAME }}-*-linux-${{ runner.arch }}.tar.gz"
          draft: true
  build-windows:
    strategy:
      matrix:
#        os: [windows-2022, windows-11-arm]  # arm is not supported by bytedeco ffmpeg
        os: [windows-2022]
        include:
          - os: windows-2022
            java_dist: 'corretto'
#          - os: windows-11-arm
#            java_dist: 'temurin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.java_dist }}
          java-version: '21'
      - run: ./gradlew clean createReleaseDistributable
      - run: pushd ./${{ env.MODULE_BASE_PATH }}build/compose/binaries && dir && cd main-release && dir && popd
      - run: echo "$GITHUB_REF_NAME" && pushd ./${{ env.MODULE_BASE_PATH }}build/compose/binaries/main-release/app && dir && powershell -Command "Compress-Archive -Path '${{ env.ARTIFACT_NAME }}' -DestinationPath 'app.zip'" && mv "app.zip" "../../../../../${{ env.MODULE_PARENT_NAVIGATION }}${{ env.DISTRIBUTION_NAME }}-${GITHUB_REF_NAME/desktop\//}-windows-${{ runner.arch }}.zip" && popd && dir
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v1
        with:
          files: "${{ env.DISTRIBUTION_NAME }}-*-windows-${{ runner.arch }}.zip"
          draft: true
  build-macos:
    strategy:
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'
      - run: ./gradlew clean packageReleaseDistributionForCurrentOS
      - run: mv ./${{ env.MODULE_BASE_PATH }}build/compose/binaries/main-release/dmg/*.dmg "./${{ env.DISTRIBUTION_NAME }}-${GITHUB_REF_NAME/desktop\//}-macos-${{ runner.arch }}.dmg"
      - uses: softprops/action-gh-release@v1
        with:
          files: "./${{ env.DISTRIBUTION_NAME }}-*-macos-${{ runner.arch }}.dmg"
          draft: true
